  <style>
    :root {
      --orange: #F04D23;

      --cream: #F5F1EC;
      --body-muted: #C9C2BA;
      --caption: #8F877E;
      --border-line: rgba(245, 241, 236, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--ink); color: var(--cream); font-family: 'Instrument Sans', sans-serif; line-height: 1.55; padding: 32px 24px; }
    .container { max-width: 1240px; margin: 0 auto; }

    /* Masthead */
    header { border-bottom: 2px solid var(--orange); padding-bottom: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; }
    .masthead-title { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: clamp(3rem, 7vw, 6rem); line-height: 0.9; text-transform: uppercase; letter-spacing: 0.5px; }
    .masthead-title span { color: var(--orange); }
    .masthead-meta { text-align: right; font-size: 13px; color: var(--caption); text-transform: uppercase; letter-spacing: 1.5px; }
    
    .meta-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-line); margin-bottom: 32px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--caption); }
    .meta-bar .badge { color: var(--cream); background: var(--card); border: 1px solid var(--border-line); padding: 4px 10px; font-weight: 700; }
