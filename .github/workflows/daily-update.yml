name: Daily Adland Newspaper Update

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-newspaper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Archive Today's Edition
        run: |
          mkdir -p editions
          TODAY=$(date +"%Y-%m-%d")
          cp index.html editions/edition-$TODAY.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update Script
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html editions/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Archive past edition and update daily news" && git push)
